server:
  port: 8081

spring:
  application:
    name: base-common
    version: 0.0.1-SNAPSHOT
    package: com.hongda.basecommon
  profiles:
      active: dev

  main:
    allow-bean-definition-overriding: true


  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev
        extension-configs:
          - data-id: base-common.yml
            group: DEFAULT_GROUP
            refresh: true



