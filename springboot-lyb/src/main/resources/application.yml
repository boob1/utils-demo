server:
  port: 8083

spring:
  application:
    name: springboot_lyb
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://localhost:3306/springboot_lyb?useSSL=false&serverTimezone=Asia/Shanghai



  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
mybatis:
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    com.hongda.springbootlyb.dao: debug
